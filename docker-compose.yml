version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crazysupporthub-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Herondale1
      POSTGRES_DB: crazysupporthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crazysupporthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: crazysupporthub-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:Herondale1@postgres:5432/crazysupporthub?schema=public
      - JWT_SECRET=super_secret_jwt_key
      - N8N_WEBHOOK_URL=http://host.docker.internal:5678/webhook/enrichment
      - N8N_WEBHOOK_SECRET=super_secret_n8n_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: crazysupporthub-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: